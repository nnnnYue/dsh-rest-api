# Development overlay: run `npx @deepseek-ai/dsh@next web --patch ./dev.patch.yml`
# from this repo's root. The relative plugin path is anchored beside this file
# (converted to a file:// URL), so no profile installation or per-machine edit
# is needed while iterating. Keep the name relative or anchored: a raw !!js cwd
# expression in `name` does not survive the profile compatibility preflight,
# which reads row.name before !!js interpolation.
- insert:
    - id: rest-api
      name: ./lib/index.js
      config:
        # loopback-only until a Bearer token is set here (or via !!js env interpolation)
        apiKey: null
        prefix: /rest/v1
